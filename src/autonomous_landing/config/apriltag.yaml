/**:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.8                 # black-square edge in metres (NOT including the white border)
    max_hamming: 0
    qos_profile: sensor_data  # best-effort: works with both reliable and best-effort camera publishers

    detector:
      threads: 2
      decimate: 2.0
      blur: 0.0
      refine: True
      sharpening: 0.25
      debug: False

    pose_estimation_method: "pnp"

    tag:
      ids: [0]
      frames: [landing_pad]
      sizes: [0.8]
